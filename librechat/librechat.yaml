# LibreChat configuration for the Agentic HR Platform
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
#
# LibreChat is the chat UI. The "HR Multi-Agent" endpoint is our Python agent core
# (orchestrator + specialist agents), plugged in as an OpenAI-compatible custom endpoint.
# The other endpoints let people chat with Groq / local models directly.
# ${VARS} come from the shared .env file (docker-compose passes them in).

version: 1.3.16
cache: true

interface:
  customWelcome: "Agentic HR Platform - synthetic demo data. Pick **HR Multi-Agent Assistant** to talk to the agents, or any other model to chat directly."
  # Retrieval over uploaded files is done by the agent core (on-demand RAG),
  # so LibreChat's own File Search / rag_api is not needed.
  fileSearch: false
  modelSelect: true
  parameters: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

registration:
  socialLogins: []

modelSpecs:
  prioritize: true
  list:
    - name: "hr-multi-agent"
      label: "HR Multi-Agent Assistant"
      description: "Orchestrator + Leave Policy, Eligibility, Approval/Workflow, Notification and Document agents"
      softDefault: true
      showOnLanding: true
      iconURL: "/assets/logo.svg"
      conversation_starters:
        - "What is our parental leave policy?"
        - "I joined three months ago. Am I eligible for paid leave?"
        - "Apply for annual leave from 11 to 13 November for a family function"
        - "Can you tell me how many leave days John Smith has left?"
      preset:
        endpoint: "HR Multi-Agent"
        model: "auto"
        modelLabel: "HR Agents"
        greeting: "Ask about HR policies, your leave balance, applying for or approving leave. Attach a PDF/DOCX to ask about it. Type /help for commands."

endpoints:
  custom:
    # --- The multi-agent platform (Python agent core) --------------------------------
    - name: "HR Multi-Agent"
      apiKey: "${AGENT_CORE_API_KEY}"
      baseURL: "${AGENT_CORE_URL}"
      models:
        # "auto" = AGENT_DEFAULT_MODEL. The real list (groq/..., openai/..., ollama/...,
        # mock/hr-demo) is fetched from the agent core's /v1/models.
        default: ["auto", "mock/hr-demo"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      titleMethod: "completion"
      modelDisplayLabel: "HR Agents"
      # Who is asking and in which conversation: the agent core maps the email to a demo
      # employee (USER_EMPLOYEE_MAP) and scopes uploaded documents per conversation.
      headers:
        X-User-Email: "{{LIBRECHAT_USER_EMAIL}}"
        X-User-Name: "{{LIBRECHAT_USER_NAME}}"
        X-User-Id: "{{LIBRECHAT_USER_ID}}"
        X-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
      # The agent trace is streamed as `reasoning_content` and shown as "Thoughts".
      customParams:
        defaultParamsEndpoint: "custom"
        reasoningKey: "reasoning_content"
      dropParams: ["stop", "frequency_penalty", "presence_penalty", "top_p"]

    # --- Direct chat with hosted and local models ------------------------------------
    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1/"
      models:
        default:
          - "qwen/qwen3.8-27b"
          - "openai/gpt-oss-120b"
          - "openai/gpt-oss-20b"
        fetch: true
      titleConvo: true
      titleModel: "openai/gpt-oss-20b"
      modelDisplayLabel: "Groq"

    - name: "Gemini"
      apiKey: "${GEMINI_API_KEY}"
      baseURL: "https://generativelanguage.googleapis.com/v1beta/openai/"
      models:
        default:
          - "gemini-3.1-flash-lite"
          - "gemini-3.5-flash"
          - "gemini-3.8-flash"
        fetch: true
      titleConvo: true
      titleModel: "gemini-3.1-flash-lite"
      modelDisplayLabel: "Gemini"

    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "${OLLAMA_BASE_URL}"
      models:
        default: ["llama3.1:8b"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Ollama"

    - name: "LM Studio"
      apiKey: "lm-studio"
      baseURL: "${LMSTUDIO_BASE_URL}"
      models:
        default: ["local-model"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "LM Studio"

fileConfig:
  endpoints:
    "HR Multi-Agent":
      # Documents reach the agent core as extracted text ("Upload as Text"),
      # where they are indexed for on-demand retrieval.
      defaultLLMDeliveryPath:
        fallback: "text"
      fileLimit: 5
      fileSizeLimit: 20
      totalSizeLimit: 50
      supportedMimeTypes:
        - "^application/pdf$"
        - "^application/vnd\\.openxmlformats-officedocument\\.wordprocessingml\\.document$"
        - "^text/.*$"
        - "^application/json$"
  # Extracted text sent with a message is capped at this many tokens per turn.
  fileTokenLimit: 100000
