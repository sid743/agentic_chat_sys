[project]
name = "agentic-core"
version = "0.1.0"
description = "Multi-agent HR assistant behind an OpenAI-compatible API (LibreChat custom endpoint)"
requires-python = ">=3.11"
readme = "../README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "openai>=1.60,<4",
    "langgraph>=0.6,<2",
    "qdrant-client>=1.12",
    "numpy>=1.26",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.4"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agentic-core = "agentic_core.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentic_core*"]

[tool.setuptools.package-data]
agentic_core = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
