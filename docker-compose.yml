# Agentic HR Platform: LibreChat (UI) + agent core (multi-agent service)
#
#   python scripts/setup_env.py
#   docker compose up -d --build
#   open http://localhost:3080  (LibreChat)   and   http://localhost:8088  (agent console)
#
# Optional local models in Docker:  docker compose --profile ollama up -d
# (then set OLLAMA_URL_IN_DOCKER=http://ollama:11434/v1 in .env)

name: agenticsys

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  agent-core:
    build: ./core
    image: agenticsys/agent-core:latest
    container_name: agent-core
    <<: *host-gateway
    env_file: .env
    environment:
      - AGENT_CORE_HOST=0.0.0.0
      - AGENT_CORE_PORT=8088
      - DATA_DIR=/app/var
      - OLLAMA_BASE_URL=${OLLAMA_URL_IN_DOCKER:-http://host.docker.internal:11434/v1}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_URL_IN_DOCKER:-http://host.docker.internal:1234/v1}
      - VLLM_BASE_URL=${VLLM_URL_IN_DOCKER:-http://host.docker.internal:8000/v1}
      - EMBEDDINGS_BASE_URL=${EMBEDDINGS_URL_IN_DOCKER:-${EMBEDDINGS_BASE_URL:-}}
    ports:
      # Localhost only by default: the admin console can browse the demo database
      # and reset it. Set AGENT_CORE_BIND=0.0.0.0 in .env to expose it deliberately.
      - "${AGENT_CORE_BIND:-127.0.0.1}:8088:8088"
    volumes:
      - agent-core-data:/app/var
      # Edit agents/providers and the policy library without rebuilding the image
      - ./core/config:/app/config:ro
      - ./core/data/policies:/app/data/policies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  librechat:
    # Stable channel. Pin a version for repeatable demos, e.g.
    # LIBRECHAT_IMAGE=registry.librechat.ai/danny-avila/librechat:v0.8.7
    image: ${LIBRECHAT_IMAGE:-registry.librechat.ai/danny-avila/librechat:latest}
    container_name: librechat
    <<: *host-gateway
    depends_on:
      mongodb:
        condition: service_started
      meilisearch:
        condition: service_started
      agent-core:
        condition: service_healthy
    # The gateway below publishes 3080. To reach LibreChat directly instead
    # (no auto-login, LibreChat's own branding), uncomment these two lines and
    # remove the gateway service.
    # ports:
    #   - "3080:3080"
    expose:
      - "3080"
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - CONFIG_PATH=/app/librechat.yaml
      - LIBRECHAT_TEMP_CREDENTIALS_PATH=/app/data/.env.temp
      # How LibreChat reaches the agent core. If you run the core on your PC instead
      # of in Docker, set AGENT_CORE_URL_FOR_LIBRECHAT=http://host.docker.internal:8088/v1
      - AGENT_CORE_URL=${AGENT_CORE_URL_FOR_LIBRECHAT:-http://agent-core:8088/v1}
      - OLLAMA_BASE_URL=${OLLAMA_URL_IN_DOCKER:-http://host.docker.internal:11434/v1}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_URL_IN_DOCKER:-http://host.docker.internal:1234/v1}
      - NO_PROXY=localhost,127.0.0.1,agent-core,mongodb,meilisearch,host.docker.internal,ollama
      - no_proxy=localhost,127.0.0.1,agent-core,mongodb,meilisearch,host.docker.internal,ollama
    volumes:
      - ./.env:/app/.env:ro
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat-images:/app/client/public/images
      - librechat-uploads:/app/uploads
      - librechat-logs:/app/logs
      - librechat-data:/app/data
    restart: unless-stopped

  # Demo front door: auto sign-in and our own icons/title in front of LibreChat.
  gateway:
    build: ./core
    image: agenticsys/agent-core:latest
    container_name: hr-gateway
    depends_on:
      - librechat
    env_file: .env
    environment:
      - GATEWAY_UPSTREAM=http://librechat:3080
      - BRAND_DIR=/app/brand
    command: ["python", "-m", "uvicorn", "agentic_core.gateway:app", "--host", "0.0.0.0", "--port", "3080"]
    ports:
      - "3080:3080"
    volumes:
      - ./deploy/brand:/app/brand:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3080/gateway/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.20
    container_name: librechat-mongodb
    command: mongod --noauth
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: librechat-meilisearch
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped

  # Optional: Ollama in Docker (CPU by default; see README for GPU)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # Optional: standalone Qdrant (set QDRANT_URL=http://qdrant:6333 in .env)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  agent-core-data:
  librechat-images:
  librechat-uploads:
  librechat-logs:
  librechat-data:
  mongo-data:
  meili-data:
  ollama-models:
  qdrant-data:
